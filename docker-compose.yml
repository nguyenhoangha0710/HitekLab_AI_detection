name: hitek-ai-iot

services:
  redis:
    image: redis:7-alpine
    container_name: hitek-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: hitek-mediamtx
    ports:
      - "8554:8554"
    restart: unless-stopped

  camera1:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera1-simulator
    depends_on:
      - mediamtx
    volumes:
      - ./code/data/videos:/videos:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/dummy_video_1.mp4
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera1
    restart: unless-stopped

  camera2:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera2-simulator
    depends_on:
      - mediamtx
    volumes:
      - ./code/data/videos:/videos:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/dummy_video_2.mp4
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera2
    restart: unless-stopped

  ai-api:
    build:
      context: ./code/ai_service
    container_name: hitek-ai-api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AI_QUEUE_BACKEND: redis
      AI_REDIS_URL: redis://redis:6379/0
      AI_REDIS_NUM_SHARDS: "1"
      AI_REDIS_FRAME_BUFFER_SIZE: "100"
      AI_REDIS_CLAIM_BATCH_SIZE: "1"
      AI_PROCESSED_STREAM_BUFFER_SIZE: "300"
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai-worker:
    build:
      context: ./code/ai_service
    container_name: hitek-ai-worker-0
    depends_on:
      redis:
        condition: service_healthy
      ai-api:
        condition: service_started
    environment:
      AI_QUEUE_BACKEND: redis
      AI_REDIS_URL: redis://redis:6379/0
      AI_REDIS_NUM_SHARDS: "1"
      AI_REDIS_FRAME_BUFFER_SIZE: "100"
      AI_REDIS_CLAIM_BATCH_SIZE: "1"
      AI_PROCESSED_STREAM_BUFFER_SIZE: "300"
      MODAL_YOLO_ENDPOINT_URL: ${MODAL_YOLO_ENDPOINT_URL:-}
    command: ["python", "-m", "app.ai_worker_main", "--shard-id", "0", "--worker-id", "ai-worker-0", "--detector", "modal", "--yolo-classes", "person,car", "--confidence", "0.35", "--modal-timeout-seconds", "30"]
    restart: unless-stopped

  ai-video-ingest:
    build:
      context: ./code/ai_service
    container_name: hitek-ai-video-ingest
    depends_on:
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
      camera1:
        condition: service_started
      camera2:
        condition: service_started
    environment:
      AI_QUEUE_BACKEND: redis
      AI_REDIS_URL: redis://redis:6379/0
      AI_REDIS_NUM_SHARDS: "1"
      AI_REDIS_FRAME_BUFFER_SIZE: "100"
      AI_REDIS_CLAIM_BATCH_SIZE: "1"
    command: ["python", "-m", "app.video_ingest_main", "--config", "config.docker.yaml"]
    restart: unless-stopped
