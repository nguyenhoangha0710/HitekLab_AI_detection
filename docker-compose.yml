name: hitek-ai-iot

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: hitek-mediamtx
    ports:
      - "8554:8554"
    restart: unless-stopped

  camera1:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera1-simulator
    depends_on:
      - mediamtx
    volumes:
      - ./code/data/videos:/videos:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/dummy_video_1.mp4
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera1
    restart: unless-stopped

  camera2:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera2-simulator
    depends_on:
      - mediamtx
    volumes:
      - ./code/data/videos:/videos:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/dummy_video_2.mp4
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera2
    restart: unless-stopped

  edge-gateway:
    build:
      context: ./code/ai_service
    container_name: hitek-edge-gateway
    depends_on:
      mediamtx:
        condition: service_started
      camera1:
        condition: service_started
      camera2:
        condition: service_started
    environment:
      MODAL_INGEST_URL: ${MODAL_INGEST_URL:-}
      MODAL_INGEST_TIMEOUT_SECONDS: "10"
      YOLO_CLASSES: "person,car"
      YOLO_CONFIDENCE: "0.35"
      TENANT_ID: ${TENANT_ID:-demo-tenant}
    command: ["python", "-m", "app.edge_gateway_main", "--config", "config.docker.yaml"]
    restart: unless-stopped
