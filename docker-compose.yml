name: hitek-ai-iot

services:
  postgres:
    image: postgres:16-alpine
    container_name: hitek-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitek_ai_iot}
      POSTGRES_USER: ${POSTGRES_USER:-hitek_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hitek_app_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./code/database/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitek_app} -d ${POSTGRES_DB:-hitek_ai_iot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: hitek-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hitek_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hitek_minio_password}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: hitek-mediamtx
    ports:
      - "8554:8554"
    restart: unless-stopped

  camera1:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera1-simulator
    depends_on:
      - mediamtx
    volumes:
      - ./code/data/videos:/videos:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/neighbors_yard.ts
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera1
    restart: unless-stopped

  camera2:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera2-simulator
    depends_on:
      - mediamtx
    volumes:
      - ./code/data/videos:/videos:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/video_4_police.mp4
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera2
    restart: unless-stopped

  edge-gateway:
    build:
      context: ./code/ai_service
    container_name: hitek-edge-gateway
    depends_on:
      mediamtx:
        condition: service_started
      camera1:
        condition: service_started
      camera2:
        condition: service_started
    environment:
      MODAL_INGEST_URL: ${MODAL_INGEST_URL:-}
      MODAL_WS_URL: ${MODAL_WS_URL:-}
      MODAL_BBOX_URL: ${MODAL_BBOX_URL:-}
      MODAL_BBOX_WS_URL: ${MODAL_BBOX_WS_URL:-ws://host.docker.internal:8003/ws/detect}
      MODAL_BBOX_TRANSPORT: ${MODAL_BBOX_TRANSPORT:-websocket}
      MODAL_TRANSPORT: ${MODAL_TRANSPORT:-viewer-ai}
      MODAL_INGEST_TIMEOUT_SECONDS: "10"
      EDGE_AI_QUEUE_SIZE: ${EDGE_AI_QUEUE_SIZE:-4}
      EDGE_VIEWER_FPS: ${VIEWER_FPS:-15}
      EDGE_AI_FPS: ${AI_FPS:-5}
      EDGE_VIEWER_HOST: "0.0.0.0"
      EDGE_VIEWER_PORT: "8002"
      YOLO_CLASSES: "person,car"
      YOLO_CONFIDENCE: "0.35"
      TENANT_ID: ${TENANT_ID:-demo-tenant}
    expose:
      - "8002"
    command: ["python", "-m", "edge_gateway.main", "--config", "config.docker.yaml"]
    restart: unless-stopped

  zone-service:
    build:
      context: .
      dockerfile: code/zone_service/Dockerfile
    container_name: hitek-zone-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      edge-gateway:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-hitek_app}:${POSTGRES_PASSWORD:-hitek_app_password}@postgres:5432/${POSTGRES_DB:-hitek_ai_iot}"
      EDGE_GATEWAY_BASE_URL: "http://edge-gateway:8002"
      ZONE_CAMERA_CONFIG_PATH: "/app/code/ai_service/config.docker.yaml"
      ZONE_DB_PATH: "/app/code/zone_service/data/zone_service.db"
      ZONE_REFERENCE_FRAME_DIR: "/app/code/zone_service/data/reference_frames"
      ZONE_EVIDENCE_DIR: "/app/code/zone_service/data/evidence"
      EVIDENCE_INTERVAL_SECONDS: ${EVIDENCE_INTERVAL_SECONDS:-120}
      ALERT_RESOLVE_GRACE_SECONDS: ${ALERT_RESOLVE_GRACE_SECONDS:-30}
      EVIDENCE_STORAGE_BACKEND: ${EVIDENCE_STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hitek_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hitek_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-hitek-evidence}
      MINIO_SECURE: "false"
      TENANT_ID: ${TENANT_ID:-demo-tenant}
    volumes:
      - zone-service-data:/app/code/zone_service/data
    ports:
      - "8010:8010"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  zone-service-data:
