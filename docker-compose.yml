# HITEK AI-IoT prototype
# Huong dan day du: HUONG_DAN_CHAY.md
#
#   cp .env.example .env          # (PowerShell: Copy-Item .env.example .env)
#   docker compose up -d --build  # COMPOSE_PROFILES=ai trong .env -> chay ca AI Service
#
# GPU NVIDIA: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

name: hitek-ai-iot

x-camera-simulator: &camera-simulator
  image: jrottenberg/ffmpeg:4.4-alpine
  depends_on:
    - mediamtx
  volumes:
    - ./code/data/videos:/videos:ro
  entrypoint: ["sh", "-c"]
  # Phat lap video thanh luong RTSP, gia lap camera IP.
  command:
    - >-
      exec ffmpeg -hide_banner -loglevel warning -re -stream_loop -1
      -i "/videos/$$VIDEO_FILE" -an -c:v libx264 -preset ultrafast -tune zerolatency
      -f rtsp -rtsp_transport tcp "rtsp://mediamtx:8554/$$STREAM_NAME"
  restart: unless-stopped

services:
  # ------------------------------------------------------------ ha tang
  postgres:
    image: postgres:16-alpine
    container_name: hitek-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitek_ai_iot}
      POSTGRES_USER: ${POSTGRES_USER:-hitek_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hitek_app_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./code/database/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitek_app} -d ${POSTGRES_DB:-hitek_ai_iot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: hitek-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hitek_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hitek_minio_password}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: hitek-mediamtx
    ports:
      - "${RTSP_PORT:-8554}:8554"
    restart: unless-stopped

  # ------------------------------------------------- camera gia lap
  camera1:
    <<: *camera-simulator
    container_name: hitek-camera1
    environment:
      VIDEO_FILE: ${CAMERA1_VIDEO:-dummy_video_2.mp4}
      STREAM_NAME: camera1

  camera2:
    <<: *camera-simulator
    container_name: hitek-camera2
    environment:
      VIDEO_FILE: ${CAMERA2_VIDEO:-dummy_video_2.mp4}
      STREAM_NAME: camera2

  # ---------------------------------------------------- ung dung
  edge-gateway:
    build:
      context: ./code/ai_service
      target: edge-gateway
    image: hitek-ai-iot/edge-gateway:local
    container_name: hitek-edge-gateway
    depends_on:
      - mediamtx
      - camera1
      - camera2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EDGE_MODE: ${EDGE_MODE:-viewer-ai}
      AI_SERVICE_WS_URL: ${AI_SERVICE_WS_URL:-ws://ai-service:8003/ws/detect}
      AI_SERVICE_TRANSPORT: ${AI_SERVICE_TRANSPORT:-websocket}
      AI_SERVICE_TIMEOUT_SECONDS: "10"
      EDGE_AI_QUEUE_SIZE: ${EDGE_AI_QUEUE_SIZE:-4}
      EDGE_VIEWER_FPS: ${VIEWER_FPS:-15}
      EDGE_AI_FPS: ${AI_FPS:-5}
      EDGE_VIEWER_HOST: "0.0.0.0"
      EDGE_VIEWER_PORT: "8002"
      YOLO_CLASSES: ${YOLO_CLASSES:-person,car,motorcycle}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.35}
      TENANT_ID: ${TENANT_ID:-demo-tenant}
    ports:
      - "${EDGE_GATEWAY_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ai-service:
    # Chi chay khi bat profile "ai" (COMPOSE_PROFILES=ai trong .env hoac --profile ai).
    profiles: ["ai"]
    build:
      context: ./code/ai_service
      target: ai-service
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: hitek-ai-iot/ai-service:cpu
    container_name: hitek-ai-service
    environment:
      ZONE_SERVICE_URL: http://zone-service:8010
      LOCAL_YOLO_MODEL: models/${YOLO_MODEL:-yolo11n.pt}
      LOCAL_YOLO_CLASSES: ${YOLO_CLASSES:-person,car,motorcycle}
      LOCAL_YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.35}
      LOCAL_YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      RULE_ENGINE_ENABLED: ${RULE_ENGINE_ENABLED:-true}
      RULE_CONFIG_TTL_SECONDS: ${RULE_CONFIG_TTL_SECONDS:-10}
      RULE_EVENT_HEARTBEAT_SECONDS: ${RULE_EVENT_HEARTBEAT_SECONDS:-1}
      RULE_TIMEZONE_OFFSET_HOURS: ${RULE_TIMEZONE_OFFSET_HOURS:-7}
    volumes:
      - ./code/ai_service/models:/app/models
    ports:
      - "${AI_SERVICE_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  zone-service:
    build:
      context: .
      dockerfile: code/zone_service/Dockerfile
    image: hitek-ai-iot/zone-service:local
    container_name: hitek-zone-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      edge-gateway:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-hitek_app}:${POSTGRES_PASSWORD:-hitek_app_password}@postgres:5432/${POSTGRES_DB:-hitek_ai_iot}"
      EDGE_GATEWAY_BASE_URL: "http://edge-gateway:8002"
      ZONE_CAMERA_CONFIG_PATH: "/app/code/ai_service/config.docker.yaml"
      ZONE_DB_PATH: "/app/code/zone_service/data/zone_service.db"
      ZONE_REFERENCE_FRAME_DIR: "/app/code/zone_service/data/reference_frames"
      ZONE_EVIDENCE_DIR: "/app/code/zone_service/data/evidence"
      EVIDENCE_INTERVAL_SECONDS: ${EVIDENCE_INTERVAL_SECONDS:-120}
      ALERT_RESOLVE_GRACE_SECONDS: ${ALERT_RESOLVE_GRACE_SECONDS:-30}
      EVIDENCE_VIDEO_ENABLED: ${EVIDENCE_VIDEO_ENABLED:-true}
      EVIDENCE_VIDEO_PRE_SECONDS: ${EVIDENCE_VIDEO_PRE_SECONDS:-5}
      EVIDENCE_VIDEO_POST_SECONDS: ${EVIDENCE_VIDEO_POST_SECONDS:-5}
      EVIDENCE_VIDEO_FPS: ${EVIDENCE_VIDEO_FPS:-10}
      EVIDENCE_VIDEO_UPLOAD_URL: "http://zone-service:8010/api/evidence/video"
      EVIDENCE_STORAGE_BACKEND: ${EVIDENCE_STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hitek_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hitek_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-hitek-evidence}
      MINIO_SECURE: "false"
      TENANT_ID: ${TENANT_ID:-demo-tenant}
      # backend: gui AI Event sang Backend API (/api/v1/events), Backend tao canh bao.
      # local  : Zone Service tu gom alert (chay thu khi khong co Backend).
      ALERT_MODE: ${ALERT_MODE:-backend}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:5250}
      BACKEND_CLIENT_ID: ${BACKEND_CLIENT_ID:-ai-service}
      BACKEND_CLIENT_SECRET: ${BACKEND_CLIENT_SECRET:-ai-service-dev-secret}
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zone-service-data:/app/code/zone_service/data
    ports:
      - "${ZONE_SERVICE_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  zone-service-data:
