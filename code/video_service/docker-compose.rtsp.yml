services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: hitek-mediamtx
    ports:
      - "8554:8554"

  camera1:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera1-simulator
    depends_on:
      - mediamtx
    volumes:
      - ../data/videos:/videos:ro # nó biết đọc video ở đâu
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re # biết realtime nhờ dòng này 
      - -stream_loop # biết loop nhờ dòng này
      - "-1"
      - -i
      - /videos/dummy_video_1.mp4 # ffmpeg đọc file ở path này
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp # biết pahts ra rtsp 
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera1 # output url
    restart: unless-stopped

  camera2:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: hitek-camera2-simulator
    depends_on:
      - mediamtx
    volumes:
      - ../data/videos:/videos:ro
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/dummy_video_2.mp4
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/camera2
    restart: unless-stopped
